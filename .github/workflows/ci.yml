name: CI

on: [push]

jobs:
  verify:
    # Tek platform: yalnızca Windows desteklenir (ADR-009, 2026-09-04).
    # Matris kasıtlı olarak kaldırıldı; ubuntu/macOS PRD kapsamında değil.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # Not: Playwright tarayıcısı burada kurulmaz — `npm run verify` E2E içermez (bilinçli
      # kapsam sınırı, docs/qa/F-001-contract.md §4/AC9). E2E yerelde `npm run e2e` ile koşulur.
      - run: npm run verify
