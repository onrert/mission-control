name: CI

on: [push]

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # Not: Playwright tarayıcısı burada kurulmaz — `npm run verify` E2E içermez (bilinçli
      # kapsam sınırı, docs/qa/F-001-contract.md §4/AC9). E2E yerelde `npm run e2e` ile koşulur.
      - run: npm run verify
